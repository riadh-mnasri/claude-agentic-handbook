[project]
name = "claude-agentic-handbook"
version = "0.1.0"
description = "Runnable examples of Claude agents and agentic workflows (Python)"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Riadh MNASRI" }]
dependencies = [
    "anthropic>=2.3",
    "claude-agent-sdk>=0.2.175",
    "mcp>=2.3",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/handbook"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["examples"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
